<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rudi's Lotto Wetterkarte</title>
</head>
<body style="margin:0;background:#0b1020;color:#eef2ff;font-family:system-ui">
<p id="boot" style="padding:24px">Lade Wetterkarte …</p>
<script>
(async () => {
  const parts = await Promise.all([
    fetch("pack1.b64"),
    fetch("pack2.b64")
  ]);
  for (const r of parts) {
    if (!r.ok) throw new Error(r.url + " " + r.status);
  }
  const packed = (await parts[0].text()).trim() + (await parts[1].text()).trim();
  const bin = Uint8Array.from(atob(packed), c => c.charCodeAt(0));
  const ds = new DecompressionStream("deflate-raw");
  const writer = ds.writable.getWriter();
  writer.write(bin);
  writer.close();
  const html = await new Response(ds.readable).text();
  document.open();
  document.write(html);
  document.close();
})().catch(err => {
  const el = document.getElementById("boot");
  if (el) el.textContent = "Konnte die Karte nicht laden: " + err;
});
</script>
</body>
</html>
